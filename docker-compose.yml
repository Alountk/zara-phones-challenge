services:
  web:
    image: ghcr.io/alountk/zara-phones-challenge:latest
    ports:
      - "3000:3000"
    environment:
      PHONES_API_BASE_URL: ${PHONES_API_BASE_URL:?Set PHONES_API_BASE_URL}
      PHONES_API_KEY: ${PHONES_API_KEY:?Set PHONES_API_KEY}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s